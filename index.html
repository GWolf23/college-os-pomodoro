<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#191919">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pomodoro Timer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#191919;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:12px;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
.timer-card{width:100%;max-width:430px;margin:0 auto;background:#262626;border:1px solid #333;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mode-row{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
button{border:0;font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none}
.mode{flex:1;min-height:44px;background:#30343a;color:#b8c0cc;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:600}
.mode.active{background:#BA0C2F;color:#fff}
.timer{text-align:center;font-size:clamp(64px,17vw,94px);font-weight:700;line-height:1;letter-spacing:-.04em;margin:24px 0 18px;font-variant-numeric:tabular-nums}
.main-btn{display:block;width:100%;min-height:56px;border-radius:12px;background:#BA0C2F;color:#fff;font-size:17px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.small-btn{min-height:48px;border-radius:10px;background:#30343a;color:#d8dde5;font-size:14px;font-weight:600}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid #BA0C2F;outline-offset:2px}
@media(hover:hover){.mode:hover,.small-btn:hover{filter:brightness(1.12)}.main-btn:hover{filter:brightness(1.08)}}
@media(max-width:330px){body{padding:8px}.timer-card{padding:14px}.timer{margin-top:20px}.mode{padding:8px 6px;font-size:12px}}
</style>
</head>
<body>
<main class="timer-card" aria-label="Pomodoro timer">
<div class="mode-row" role="tablist" aria-label="Timer mode">
<button class="mode active" type="button" data-mode="focus" role="tab" aria-selected="true">Focus</button>
<button class="mode" type="button" data-mode="short" role="tab" aria-selected="false">Short Break</button>
<button class="mode" type="button" data-mode="long" role="tab" aria-selected="false">Long Break</button>
</div>
<div class="timer" id="timer" aria-live="polite">25:00</div>
<button class="main-btn" id="startBtn" type="button">START FOCUS</button>
<div class="controls">
<button class="small-btn" id="resetBtn" type="button">Reset</button>
<button class="small-btn" id="skipBtn" type="button">Skip</button>
</div>
</main>
<script>
(()=>{"use strict";
const timerEl=document.getElementById("timer"),startBtn=document.getElementById("startBtn"),resetBtn=document.getElementById("resetBtn"),skipBtn=document.getElementById("skipBtn"),modeButtons=[...document.querySelectorAll(".mode")];
const durations={focus:25,short:5,long:15},names={focus:"Focus",short:"Short Break",long:"Long Break"},KEY="collegeOSPomodoro";
let mode="focus",running=false,remaining=1500,endTime=null,intervalId=null,focusSessionsInCycle=0;

function load(){
 try{
  const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(!s)return;
  const today=new Date().toDateString();
  if(s.date===today&&Number.isFinite(s.focusSessions))focusSessions=Math.max(0,s.focusSessions);
  if(s.mode&&durations[s.mode])mode=s.mode;
  if(s.running&&Number.isFinite(s.endTime)){
   const left=Math.ceil((s.endTime-Date.now())/1000);
   if(left>0){running=true;endTime=s.endTime;remaining=left}
   else{remaining=durations[mode]*60}
  }else if(Number.isFinite(s.remaining))remaining=Math.max(0,s.remaining);
 }catch(e){}
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify({date:new Date().toDateString(),focusSessionsInCycle,mode,running,remaining,endTime}))}catch(e){}
}
function render(){
 const r=Math.max(0,Math.floor(remaining)),m=Math.floor(r/60),s=r%60;
 timerEl.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 startBtn.textContent=running?"PAUSE":mode==="focus"?"START FOCUS":"START BREAK";
 document.title=timerEl.textContent+" • "+names[mode];
 modeButtons.forEach(b=>{const a=b.dataset.mode===mode;b.classList.toggle("active",a);b.setAttribute("aria-selected",String(a))});
}
function beep(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=new AC();if(c.state==="suspended")c.resume().catch(()=>{});
  const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=880;
  g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.08,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35);setTimeout(()=>{try{c.close()}catch(e){}},500);
 }catch(e){}
}
function stop(){running=false;endTime=null;if(intervalId!==null){clearInterval(intervalId);intervalId=null}save();render()}
function start(){
 if(running){stop();return}
 if(remaining<=0)remaining=durations[mode]*60;
 running=true;endTime=Date.now()+remaining*1000;
 if(intervalId!==null)clearInterval(intervalId);intervalId=setInterval(tick,250);save();render();
}
function tick(){
 if(!running||endTime===null)return;
 remaining=Math.max(0,Math.ceil((endTime-Date.now())/1000));render();
 if(remaining<=0)finish();
}
function finish(){
 const finished=mode;stop();beep();
 if(finished==="focus"){
    // Four-focus cycle: 25/5, 25/5, 25/5, 25/15, then repeat.
    focusSessionsInCycle++;
    if(focusSessionsInCycle >= 4){
      mode="long";
      focusSessionsInCycle=0;
    }else{
      mode="short";
    }
  }else{
    // Both short and long breaks are followed by Focus.
    mode="focus";
  }
 remaining=durations[mode]*60;save();render();
}
function reset(){stop();remaining=durations[mode]*60;save();render()}
function skip(){finish()}
function setMode(m){if(!durations[m])return;stop();mode=m;remaining=durations[mode]*60;save();render()}

startBtn.addEventListener("click",start);
resetBtn.addEventListener("click",reset);
skipBtn.addEventListener("click",skip);
modeButtons.forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

document.addEventListener("visibilitychange",()=>{if(running){tick();if(running&&intervalId===null)intervalId=setInterval(tick,250)}});
window.addEventListener("pageshow",()=>{if(running)tick()});

load();
if(running){intervalId=setInterval(tick,250);tick()}else{remaining=remaining>0?remaining:durations[mode]*60;render()}
})();
</script>
</body>
</html>
