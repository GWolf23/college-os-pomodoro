<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>College OS Pomodoro</title>
<style>
  * { box-sizing: border-box; }
  html, body {
  margin: 0;
  min-height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #383836;
  color: #f5f7fa;
}

body {
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.timer-card {
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  background: #171b22;
  border: 1px solid #2b313b;
  border-radius: 12px;
  padding: 18px;
}
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    color: #aab2bf;
  }
  .session {
    font-size: 12px;
    color: #8f98a6;
  }
  .timer {
    text-align: center;
    font-size: clamp(64px, 17vw, 94px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    margin: 24px 0 18px;
    font-variant-numeric: tabular-nums;
  }
  .mode-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }
  button {
    border: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  .mode {
    background: #222833;
    color: #aeb6c3;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
  }
  .mode.active {
    background: #b71c2b;
    color: white;
  }
  .main-btn {
    display: block;
    width: 100%;
    min-height: 52px;
    border-radius: 12px;
    background: #b71c2b;
    font-size: 17px;
    font-weight: 700;
  }
  .main-btn:active, .small-btn:active, .mode:active {
    transform: scale(.98);
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .small-btn {
    min-height: 42px;
    border-radius: 10px;
    background: #222833;
    color: #d8dde5;
    font-size: 13px;
    font-weight: 600;
  }
  .settings {
    margin-top: 14px;
    border-top: 1px solid #2b313b;
    padding-top: 12px;
  }
  .settings summary {
    color: #8f98a6;
    font-size: 12px;
    cursor: pointer;
    padding: 4px 0;
  }
  .settings-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .field label {
    display: block;
    color: #8f98a6;
    font-size: 10px;
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    background: #0f1319;
    border: 1px solid #303744;
    border-radius: 8px;
    color: white;
    padding: 8px;
    font-size: 13px;
  }
  .options {
    display: grid;
    gap: 7px;
    margin-top: 10px;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #aeb6c3;
    font-size: 12px;
  }
  .check input {
    width: 16px;
    height: 16px;
    accent-color: #b71c2b;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    color: #707987;
    font-size: 10px;
  }
  @media (max-width: 330px) {
    .timer-card { padding: 14px; }
    .timer { margin-top: 20px; }
    .mode { padding: 8px 9px; }
  }
</style>
</head>
<body>
<div class="timer-card">
  <div class="top">
    <div class="label">FOCUS TIMER</div>
    <div class="session" id="sessionText">Pomodoro 1</div>
  </div>

  <div class="mode-row">
    <button class="mode active" data-mode="focus">Focus</button>
    <button class="mode" data-mode="short">Short Break</button>
    <button class="mode" data-mode="long">Long Break</button>
  </div>

  <div class="timer" id="timer">25:00</div>

  <button class="main-btn" id="startBtn">START FOCUS</button>

  <div class="controls">
    <button class="small-btn" id="resetBtn">Reset</button>
    <button class="small-btn" id="skipBtn">Skip</button>
  </div>

  <details class="settings">
    <summary>Timer settings</summary>
    <div class="settings-grid">
      <div class="field">
        <label>Focus (min)</label>
        <input id="focusInput" type="number" min="1" max="120" value="25">
      </div>
      <div class="field">
        <label>Short break</label>
        <input id="shortInput" type="number" min="1" max="60" value="5">
      </div>
      <div class="field">
        <label>Long break</label>
        <input id="longInput" type="number" min="1" max="60" value="15">
      </div>
    </div>
    <div class="options">
      <label class="check">
        <input id="autoStart" type="checkbox">
        Auto-start the next session
      </label>
      <label class="check">
        <input id="soundOn" type="checkbox" checked>
        Sound when a session ends
      </label>
    </div>
  </details>

  <div class="footer">
    <span>College OS</span>
    <span id="todayCount">0 sessions today</span>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const timerEl = $("timer");
  const startBtn = $("startBtn");
  const resetBtn = $("resetBtn");
  const skipBtn = $("skipBtn");
  const sessionText = $("sessionText");
  const todayCount = $("todayCount");

  const inputs = {
    focus: $("focusInput"),
    short: $("shortInput"),
    long: $("longInput")
  };

  const modeNames = {
    focus: "Focus",
    short: "Short Break",
    long: "Long Break"
  };

  let mode = "focus";
  let running = false;
  let remaining = 25 * 60;
  let endTime = null;
  let interval = null;
  let pomodoros = 1;

  const saved = JSON.parse(localStorage.getItem("collegeOSPomodoro") || "{}");

  if (saved.settings) {
    inputs.focus.value = saved.settings.focus ?? 25;
    inputs.short.value = saved.settings.short ?? 5;
    inputs.long.value = saved.settings.long ?? 15;
    $("autoStart").checked = !!saved.settings.autoStart;
    $("soundOn").checked = saved.settings.soundOn !== false;
  }

  const todayKey = new Date().toISOString().slice(0,10);
  let completedToday = saved.date === todayKey ? (saved.completedToday || 0) : 0;

  function minutesFor(m) {
    return Number(inputs[m].value) || 25;
  }

  function save() {
    localStorage.setItem("collegeOSPomodoro", JSON.stringify({
      date: todayKey,
      completedToday,
      settings: {
        focus: minutesFor("focus"),
        short: minutesFor("short"),
        long: minutesFor("long"),
        autoStart: $("autoStart").checked,
        soundOn: $("soundOn").checked
      }
    }));
  }

  function render() {
    const mins = Math.floor(remaining / 60);
    const secs = remaining % 60;
    timerEl.textContent = `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
    document.title = `${timerEl.textContent} • ${modeNames[mode]}`;

    sessionText.textContent =
      mode === "focus" ? `Pomodoro ${pomodoros}` : modeNames[mode];

    startBtn.textContent = running
      ? "PAUSE"
      : (mode === "focus" ? "START FOCUS" : "START BREAK");

    document.querySelectorAll(".mode").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.mode === mode);
    });

    todayCount.textContent =
      `${completedToday} ${completedToday === 1 ? "session" : "sessions"} today`;
  }

  function setMode(newMode) {
    stop();
    mode = newMode;
    remaining = minutesFor(mode) * 60;
    render();
  }

  function beep() {
    if (!$("soundOn").checked) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = 880;
      gain.gain.value = 0.08;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch (e) {}
  }

  function finishSession() {
    stop();
    beep();

    if (mode === "focus") {
      completedToday++;
      save();

      if (pomodoros % 4 === 0) {
        mode = "long";
      } else {
        mode = "short";
      }
    } else {
      if (mode === "long") pomodoros = 1;
      mode = "focus";
      if (mode === "focus" && pomodoros < 4) pomodoros++;
    }

    remaining = minutesFor(mode) * 60;
    render();

    if ($("autoStart").checked) start();
  }

  function tick() {
    if (!endTime) return;
    remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    render();
    if (remaining <= 0) finishSession();
  }

  function start() {
    if (running) {
      stop();
      return;
    }
    running = true;
    endTime = Date.now() + remaining * 1000;
    interval = setInterval(tick, 250);
    render();
  }

  function stop() {
    running = false;
    endTime = null;
    if (interval) clearInterval(interval);
    interval = null;
    render();
  }

  function reset() {
    stop();
    remaining = minutesFor(mode) * 60;
    render();
  }

  function skip() {
    finishSession();
  }

  startBtn.addEventListener("click", start);
  resetBtn.addEventListener("click", reset);
  skipBtn.addEventListener("click", skip);

  document.querySelectorAll(".mode").forEach(btn => {
    btn.addEventListener("click", () => setMode(btn.dataset.mode));
  });

  Object.values(inputs).forEach(input => {
    input.addEventListener("change", () => {
      save();
      if (!running) {
        remaining = minutesFor(mode) * 60;
        render();
      }
    });
  });

  $("autoStart").addEventListener("change", save);
  $("soundOn").addEventListener("change", save);

  render();
})();
</script>
</body>
</html>
